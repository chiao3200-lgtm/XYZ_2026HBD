<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>夏以晝 · 秘密結局 · 18+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+TC:wght@300;400;500;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --serif:'Noto Serif TC',serif; --disp:'Cormorant Garamond','Noto Serif TC',serif; --mono:'Space Mono','Noto Serif TC',monospace;
  --bg:#070a14; --bg2:#0c1124; --panel:rgba(20,28,54,0.62);
  --gold:#f0c074; --gold2:#ffdc9a; --goldd:#c8964a; --cyan:#74b0ea; --cyan2:#a3d0f6; --rose:#e7a0ac;
  --tx:#eef3fc; --tx2:#b6c2dc; --tx3:#7f8db0; --tx4:#586588;
  --line:rgba(120,155,220,0.16); --line2:rgba(120,155,220,0.08); --hair:rgba(240,192,116,0.30);
  --r:18px; --t:0.3s cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#04060d;display:flex;align-items:center;justify-content:center;font-family:var(--serif);overflow:hidden;user-select:none;color:var(--tx);}
#app{position:relative;width:390px;height:844px;overflow:hidden;background:#08060c;transform-origin:center center;}
@media(max-width:430px){#app{width:100vw;height:100svh;transform:none!important;}}
@media(min-width:431px){#app{border-radius:40px;box-shadow:0 0 0 1px rgba(120,155,220,0.14),0 40px 120px rgba(0,8,24,0.7),0 0 90px rgba(231,160,172,0.06);}}

.atmos{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.atmos .stars{position:absolute;inset:0;background-image:
  radial-gradient(1.2px 1.2px at 22% 28%,rgba(255,255,255,0.6),transparent),
  radial-gradient(1px 1px at 70% 18%,rgba(255,230,240,0.5),transparent),
  radial-gradient(1.1px 1.1px at 44% 66%,rgba(255,255,255,0.5),transparent),
  radial-gradient(1px 1px at 86% 60%,rgba(231,160,172,0.5),transparent);
  background-repeat:no-repeat;animation:twk 5.5s ease-in-out infinite alternate;}
@keyframes twk{from{opacity:0.5}to{opacity:1}}

.scr{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity var(--t);}
.scr.on{opacity:1;pointer-events:all;}
.btn{border:none;cursor:pointer;font-family:var(--serif);transition:opacity .15s,transform .15s;}
.btn:active{transform:scale(0.975);}
.btn-ghost{background:rgba(255,255,255,0.04);color:var(--tx2);border:1px solid var(--line);border-radius:99px;font-size:14px;padding:8px 16px;letter-spacing:0.12em;font-family:var(--mono);}
.btn-line{background:rgba(116,176,234,0.06);color:var(--cyan2);border:1px solid rgba(116,176,234,0.32);border-radius:var(--r);font-size:16px;padding:14px;letter-spacing:0.16em;font-weight:500;}
.art-img{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.06);animation:kbn 16s ease-in-out infinite alternate;}
@keyframes kbn{from{transform:scale(1.04) translateY(0)}to{transform:scale(1.12) translateY(-12px)}}

/* ── AGE GATE ── */
#age{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:0 26px;
  background:rgba(4,6,14,0.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:opacity .3s;}
#age.off{opacity:0;pointer-events:none;}
.age-card{width:300px;background:linear-gradient(160deg,#1a0e16,#0a0710);border:1px solid rgba(231,160,172,0.4);
  border-radius:22px;padding:30px 24px 24px;text-align:center;box-shadow:0 30px 70px rgba(0,4,16,0.7);}
.age-icon{font-size:42px;margin-bottom:12px;}
.age-h{font-size:19px;font-weight:700;color:var(--tx);letter-spacing:0.04em;margin-bottom:9px;}
.age-msg{font-size:14px;color:var(--tx2);line-height:1.9;margin-bottom:22px;}
.age-msg b{color:var(--rose);}
.age-yes{width:100%;padding:15px;border-radius:12px;font-size:15px;font-weight:700;letter-spacing:0.08em;
  background:linear-gradient(135deg,#f3b8c4,var(--rose));color:#2a0d14;box-shadow:0 8px 22px rgba(231,160,172,0.3);}
.age-no{width:100%;padding:13px;margin-top:10px;border-radius:12px;font-size:13.5px;letter-spacing:0.08em;
  background:rgba(255,255,255,0.05);color:var(--tx3);border:1px solid var(--line);}

/* ── SECRET ALBUM ── */
#scr-secret{background:#08060c;}
#se-art{position:absolute;inset:0;z-index:0;overflow:hidden;background:#08060c;transition:background .8s ease;}
.st-emoji{position:absolute;top:50%;left:50%;transform:translate(-50%,-58%);font-size:150px;z-index:1;
  animation:flt 5s ease-in-out infinite alternate;filter:drop-shadow(0 10px 40px rgba(0,0,0,0.5));}
@keyframes flt{from{transform:translate(-50%,-58%) scale(1)}to{transform:translate(-50%,-62%) scale(1.04)}}
.st-ov{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(to bottom,rgba(5,7,15,0.5) 0%,transparent 26%,transparent 48%,rgba(5,7,15,0.86) 100%);}
.se-vig{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 42%,transparent 38%,rgba(20,4,14,0.55) 100%),
    linear-gradient(to bottom,rgba(12,4,10,0.5) 0%,transparent 24%,transparent 46%,rgba(12,4,10,0.9) 100%);}
.st-nav{position:absolute;top:0;left:0;right:0;z-index:12;padding:52px 18px 0;display:flex;justify-content:space-between;align-items:center;transition:opacity .35s,transform .35s;}
.st-tagcode{font-family:var(--mono);font-size:11px;letter-spacing:0.24em;color:rgba(243,184,196,0.78);}
.st-navbtns{display:flex;gap:8px;}
.se-progress{position:absolute;top:96px;left:0;right:0;z-index:12;display:flex;gap:7px;justify-content:center;transition:opacity .35s;}
.se-progress i{width:20px;height:3px;border-radius:2px;background:rgba(255,255,255,0.22);transition:background .3s,width .3s;}
.se-progress i.on{background:linear-gradient(90deg,var(--rose),var(--gold2));width:30px;}
.st-box{position:absolute;left:0;right:0;bottom:0;z-index:12;padding:0 14px 30px;transition:opacity .35s,transform .35s;}
.st-inner{position:relative;cursor:pointer;min-height:138px;border-radius:var(--r);padding:22px 20px 26px;
  background:rgba(16,8,16,0.74);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(231,160,172,0.28);box-shadow:0 -6px 36px rgba(0,4,16,0.5);}
.st-spk{position:absolute;top:-13px;left:16px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:0.1em;
  color:#2a0d14;background:linear-gradient(135deg,#f3b8c4,var(--rose));padding:3px 13px;border-radius:7px;opacity:0;transition:opacity .22s;box-shadow:0 4px 14px rgba(231,160,172,0.4);}
.st-spk.show{opacity:1;}
.st-txt{font-size:17.5px;color:var(--tx);line-height:2;letter-spacing:0.05em;font-weight:300;min-height:62px;}
.st-cursor{display:inline-block;width:2px;height:17px;background:var(--rose);margin-left:2px;vertical-align:middle;animation:cb .9s step-end infinite;}
@keyframes cb{0%,100%{opacity:1}50%{opacity:0}}
.st-tap{position:absolute;bottom:9px;right:14px;font-family:var(--mono);font-size:8.5px;letter-spacing:0.16em;color:var(--tx4);animation:tb 2.4s ease-in-out infinite;}
@keyframes tb{0%,100%{opacity:1}50%{opacity:0.25}}
#scr-secret.ui-off .st-box,#scr-secret.ui-off .st-nav,#scr-secret.ui-off .se-progress{opacity:0;pointer-events:none;}
#scr-secret.ui-off .st-box{transform:translateY(30px);}
#scr-secret.ui-off .st-nav{transform:translateY(-16px);}
.st-restore{position:absolute;inset:0;z-index:11;display:none;align-items:flex-end;justify-content:center;padding-bottom:46px;cursor:pointer;}
#scr-secret.ui-off .st-restore{display:flex;}
.st-restore .pill{font-family:var(--mono);font-size:12px;letter-spacing:0.18em;color:rgba(255,255,255,0.82);
  background:rgba(16,8,16,0.5);border:1px solid rgba(255,255,255,0.18);border-radius:99px;padding:8px 18px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:tb 2.6s ease-in-out infinite;}

/* ── CREDITS ── */
.cr-hero{flex:0 0 auto;text-align:center;padding:80px 24px 24px;position:relative;}
.cr-glow{position:absolute;top:34px;left:50%;transform:translateX(-50%);width:210px;height:210px;border-radius:50%;
  background:radial-gradient(circle,rgba(231,160,172,0.2),transparent 64%);}
.cr-e{font-size:60px;position:relative;animation:floaty 3.6s ease-in-out infinite alternate;display:inline-flex;}
@keyframes floaty{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.cr-t{font-size:25px;font-weight:700;color:var(--tx);letter-spacing:0.1em;margin-top:10px;position:relative;
  background:linear-gradient(120deg,#fff,var(--rose) 60%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.cr-d{font-family:var(--mono);font-size:13px;letter-spacing:0.3em;color:var(--gold2);margin-top:8px;}
.cr-scroll{flex:1;overflow-y:auto;scrollbar-width:none;padding:8px 22px 26px;}
.cr-scroll::-webkit-scrollbar{display:none;}
.cr-body{display:flex;flex-direction:column;gap:11px;}
.cr-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 17px;display:flex;align-items:center;gap:14px;}
.cr-ic{font-size:25px;}
.cr-role{font-family:var(--mono);font-size:11px;letter-spacing:0.22em;color:var(--rose);margin-bottom:3px;}
.cr-name{font-size:16px;color:var(--tx);font-weight:500;letter-spacing:0.04em;}
.cr-thx{background:linear-gradient(120deg,rgba(231,160,172,0.14),rgba(240,192,116,0.12));border:1px solid var(--line);
  border-radius:var(--r);padding:20px;text-align:center;font-size:17px;color:var(--tx);line-height:1.95;letter-spacing:0.06em;}
.cr-sm{font-family:var(--mono);font-size:11.5px;color:var(--tx3);letter-spacing:0.06em;line-height:1.9;text-align:center;}
.cr-back{flex:0 0 auto;padding:14px 22px 34px;}
.hidden{display:none!important;}
</style>
</head>
<body>
<div id="app">
  <div class="atmos"><div class="stars"></div></div>

  <!-- ══ SECRET ALBUM ══ -->
  <div class="scr" id="scr-secret">
    <div id="se-art"><div class="st-emoji" id="se-emoji">🌹</div></div>
    <div class="st-ov"></div>
    <div class="se-vig"></div>
    <div class="st-nav" id="se-nav">
      <div class="st-tagcode" id="se-code">SECRET · 01</div>
      <div class="st-navbtns">
        <button class="btn btn-ghost" onclick="toggleSecretUI()">隱藏對話</button>
        <button class="btn btn-ghost" onclick="endSecret()">跳過 ⏭</button>
      </div>
    </div>
    <div class="se-progress" id="se-progress"></div>
    <div class="st-restore" id="se-restore" onclick="toggleSecretUI()">
      <div class="pill">點擊任意處 · 顯示對話</div>
    </div>
    <div class="st-box" id="se-box">
      <div class="st-inner" onclick="nextSecret()">
        <div class="st-spk" id="se-spk">夏以晝</div>
        <div class="st-txt" id="se-txt"><span class="st-cursor"></span></div>
        <div class="st-tap">點擊繼續</div>
      </div>
    </div>
  </div>

  <!-- ══ CREDITS ══ -->
  <div class="scr" id="scr-credits">
    <div class="cr-hero">
      <div class="cr-glow"></div>
      <div class="cr-e">🌹</div>
      <div class="cr-t">秘密結局 · 完</div>
      <div class="cr-d">SECRET ENDING · 0613</div>
    </div>
    <div class="cr-scroll">
      <div class="cr-body">
        <div class="cr-card"><div class="cr-ic">✦</div><div><div class="cr-role">STORY & DESIGN</div><div class="cr-name">TsangFei</div></div></div>
        <div class="cr-card"><div class="cr-ic">✦</div><div><div class="cr-role">CHARACTER</div><div class="cr-name">戀與深空 · 夏以晝</div></div></div>
        <div class="cr-card"><div class="cr-ic">✦</div><div><div class="cr-role">SPECIAL THANKS</div><div class="cr-name">感謝每個遊玩的玩家</div></div></div>
        <div class="cr-sm">© 2026 夏以晝生日企劃 · 18+<br>角色版權歸屬《戀與深空》</div>
      </div>
    </div>
    <div class="cr-back"><button class="btn btn-line" onclick="goHome()" style="width:100%">← 回到主頁</button></div>
  </div>
</div>

<script>
/* ━━━ 秘密結局相簿（18+ 親密劇情） ━━━
   換 CG：把 cg 填上圖片路徑（留空則用 emoji ＋ 漸層底）。
   CG 建議 9:19.5 直式全螢幕，1080×2340 px。同一 id 的多段對話共用同一張 CG。 */
const HOME_URL='index.html';
const SECRET={ scenes:[
  {id:'S-1', emoji:'🚪', cg:'', bg:'#1a0810', spk:'夏以晝', t:'門在身後輕輕闔上。他卸下了統帥、卸下了所有世界線的重量，只剩此刻看著妳的眼神。'},
  {id:'S-1', emoji:'🚪', cg:'', bg:'#1a0810', spk:'夏以晝', t:'「跨越了那麼多世界線，」他低聲說，指尖掠過妳的臉頰，「我只想確認一件事——這一次，妳是真的留在我身邊。」'},
  {id:'S-2', emoji:'🌹', cg:'', bg:'#220a16', spk:'夏以晝', t:'他的呼吸落在妳耳邊，溫熱而克制。那雙慣於發號施令的手，此刻卻在妳腰際停得格外輕、格外珍重。'},
  {id:'S-2', emoji:'🌹', cg:'', bg:'#220a16', spk:'夏以晝', t:'「告訴我，」他的聲音沉得像要把人揉進懷裡，「妳也想要我……對不對。」'},
  {id:'S-3', emoji:'💋', cg:'', bg:'#2a0a18', spk:'', t:'妳踮起腳尖回應了他。那個吻起初很輕，像怕驚動了什麼，而後漸漸深了——他扣住妳的後頸，把所有沒說出口的渴望都傾注進來。'},
  {id:'S-3', emoji:'💋', cg:'', bg:'#2a0a18', spk:'夏以晝', t:'「別躲。」他額頭抵著妳的，氣息交纏，「今晚，我想把妳記在每一個世界線裡。」'},
  {id:'S-4', emoji:'🌙', cg:'', bg:'#16060f', spk:'', t:'燈光一寸寸暗了下去。窗外是流轉的星海，室內只剩交疊的呼吸與心跳，和他一聲聲喚著妳名字的、近乎虔誠的低語。'},
  {id:'S-4', emoji:'🌙', cg:'', bg:'#16060f', spk:'夏以晝', t:'「我愛妳。」他在妳耳畔反覆地說，像是要烙進骨血裡，「在這個世界線，在所有世界線。」'},
  {id:'S-5', emoji:'🌅', cg:'', bg:'#1e1018', spk:'', t:'天光微亮時，他仍把妳緊緊圈在懷裡，下巴抵著妳的髮頂，呼吸均勻而安定。'},
  {id:'S-5', emoji:'🌅', cg:'', bg:'#1e1018', spk:'夏以晝', t:'「生日快樂。」他在晨光裡輕吻妳的眉心，嗓音還帶著睡意的沙啞，「往後每一個清晨，我都要這樣醒來——身邊有妳。」'},
  {id:'S-6', emoji:'💍', cg:'', bg:'#241318', spk:'夏以晝', t:'「這個秘密的世界線，」他十指扣緊妳的手，金色的晨曦落在交握的指間，「就只屬於我們兩個人。永遠。」'},
]};

let seIdx=0, seTyping=false, seT=null;

function fit(){const app=document.getElementById('app');if(window.innerWidth<=430){app.style.transform='';return;}
  const k=Math.min((window.innerHeight-28)/844,(window.innerWidth-28)/390,1.25);app.style.transform='scale('+Math.max(k,0.4)+')';}
window.addEventListener('resize',fit);
window.onload=()=>{fit();SECRET.scenes.forEach(s=>{if(s.cg){const im=new Image();im.src=s.cg;}});enterSecret();};

function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');}
function goHome(){window.location.href=HOME_URL;}

function enterSecret(){seIdx=0;seTyping=false;document.getElementById('scr-secret').classList.remove('ui-off');buildProgress();show('scr-secret');setTimeout(renderSecret,260);}
function ids(){return [...new Set(SECRET.scenes.map(s=>s.id))];}
function buildProgress(){document.getElementById('se-progress').innerHTML=ids().map(()=>'<i></i>').join('');}
function curIdx(){return ids().indexOf(SECRET.scenes[seIdx].id);}
function renderSecret(){
  if(seIdx>=SECRET.scenes.length){endSecret();return;}
  const sc=SECRET.scenes[seIdx],art=document.getElementById('se-art');
  if(sc.cg){art.style.background='#08060c';art.innerHTML='<div class="art-img" style="background-image:url(\''+sc.cg+'\')"></div>';}
  else{art.style.background='radial-gradient(120% 80% at 50% 36%,'+sc.bg+' 0%,#08060c 120%)';art.innerHTML='<div class="st-emoji">'+sc.emoji+'</div>';}
  document.getElementById('se-code').textContent='SECRET · '+String(curIdx()+1).padStart(2,'0');
  const ci=curIdx();document.querySelectorAll('#se-progress i').forEach((d,i)=>d.classList.toggle('on',i<=ci));
  const spk=document.getElementById('se-spk'),txt=document.getElementById('se-txt');
  spk.textContent=sc.spk||'旁白';spk.classList.toggle('show',!!sc.spk);
  txt.innerHTML='<span class="st-cursor"></span>';seTyping=true;let i=0;const t=sc.t;
  if(seT)clearInterval(seT);
  seT=setInterval(()=>{if(i<t.length){txt.innerHTML=t.slice(0,++i)+'<span class="st-cursor"></span>';}else{clearInterval(seT);seTyping=false;}},40);
}
function nextSecret(){
  if(document.getElementById('scr-secret').classList.contains('ui-off'))return;
  if(seTyping){clearInterval(seT);seTyping=false;document.getElementById('se-txt').innerHTML=SECRET.scenes[seIdx].t+'<span class="st-cursor"></span>';return;}
  seIdx++;renderSecret();
}
function toggleSecretUI(){document.getElementById('scr-secret').classList.toggle('ui-off');}
function endSecret(){clearInterval(seT);show('scr-credits');}
</script>
</body>
</html>
