<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>夏以晝 · 0613 · Language / 語言</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@300;500;700;900&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --serif:'Noto Serif TC',serif;
  --disp:'Cormorant Garamond','Noto Serif TC',serif;
  --mono:'Space Mono','Noto Serif TC',monospace;
  --bg:#070a14; --gold:#f0c074; --gold2:#ffdc9a; --goldd:#c8964a;
  --cyan:#74b0ea; --cyan2:#a3d0f6; --rose:#e7a0ac;
  --tx:#eef3fc; --tx2:#b6c2dc; --tx3:#7f8db0;
  --line:rgba(120,155,220,0.16); --hair:rgba(240,192,116,0.30);
  --r:18px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#04060d;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);overflow:hidden;color:var(--tx);user-select:none;}
#app{position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);transform-origin:center center;}
@media(max-width:430px){#app{width:100vw;height:100svh;transform:none!important;}}
@media(min-width:431px){#app{border-radius:40px;box-shadow:0 0 0 1px rgba(120,155,220,0.14),0 40px 120px rgba(0,8,24,0.7),0 0 90px rgba(116,176,234,0.06);}}

.atmos{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.aurora{position:absolute;inset:-20%;
  background:
    radial-gradient(40% 32% at 22% 14%,rgba(116,176,234,0.18),transparent 60%),
    radial-gradient(46% 34% at 82% 8%,rgba(240,192,116,0.12),transparent 60%),
    radial-gradient(60% 42% at 50% 104%,rgba(231,160,172,0.10),transparent 60%),
    radial-gradient(70% 60% at 70% 60%,rgba(60,90,160,0.16),transparent 70%);
  animation:auro 18s ease-in-out infinite alternate;}
@keyframes auro{from{transform:translate3d(-2%,-1%,0) scale(1.02)}to{transform:translate3d(3%,2%,0) scale(1.08)}}
.stars{position:absolute;inset:0;background-repeat:no-repeat;animation:twk 5.5s ease-in-out infinite alternate;
  background-image:
    radial-gradient(1.4px 1.4px at 20% 30%,rgba(255,255,255,0.7),transparent),
    radial-gradient(1.1px 1.1px at 70% 20%,rgba(255,255,255,0.55),transparent),
    radial-gradient(1.2px 1.2px at 40% 70%,rgba(255,255,255,0.6),transparent),
    radial-gradient(1px 1px at 85% 65%,rgba(200,220,255,0.6),transparent),
    radial-gradient(1.3px 1.3px at 55% 45%,rgba(255,255,255,0.5),transparent),
    radial-gradient(1px 1px at 12% 82%,rgba(255,255,255,0.5),transparent),
    radial-gradient(1.1px 1.1px at 90% 38%,rgba(255,240,210,0.6),transparent),
    radial-gradient(1px 1px at 32% 12%,rgba(255,255,255,0.45),transparent);}
@keyframes twk{from{opacity:0.5}to{opacity:1}}

.wrap{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 34px;gap:0;}
.orbit{position:absolute;top:96px;width:240px;height:240px;border-radius:50%;border:1px solid rgba(116,176,234,0.16);
  box-shadow:0 0 0 22px rgba(116,176,234,0.03),inset 0 0 60px rgba(116,176,234,0.05);}
.orbit::after{content:'';position:absolute;top:10%;left:8%;width:9px;height:9px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 14px var(--gold);animation:orb 14s linear infinite;transform-origin:110px 110px;}
@keyframes orb{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.kick{font-family:var(--mono);font-size:11.5px;letter-spacing:0.34em;color:var(--cyan);text-transform:uppercase;margin-bottom:16px;}
.name{font-family:var(--serif);font-weight:900;font-size:52px;letter-spacing:0.04em;line-height:1.02;
  background:linear-gradient(120deg,#fff 8%,var(--gold2) 48%,var(--cyan2) 96%);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.en{font-family:var(--disp);font-style:italic;font-size:18px;letter-spacing:0.04em;color:var(--tx3);margin-top:6px;}
.date{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-family:var(--mono);
  font-size:13px;letter-spacing:0.24em;color:var(--gold2);
  border:1px solid var(--hair);border-radius:99px;padding:6px 16px;background:rgba(240,192,116,0.05);}

.pick{margin-top:46px;width:100%;display:flex;flex-direction:column;gap:13px;}
.pick-lbl{font-family:var(--mono);font-size:11px;letter-spacing:0.3em;color:var(--tx3);text-align:center;margin-bottom:3px;}
.lang{display:flex;align-items:center;gap:15px;width:100%;cursor:pointer;text-decoration:none;
  background:var(--panel,rgba(20,28,54,0.55));border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;transition:transform .15s,border-color .2s,background .2s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.lang:active{transform:scale(0.98);}
.lang:hover{border-color:var(--hair);background:rgba(240,192,116,0.06);}
.lang .ic{font-family:var(--disp);font-size:30px;font-weight:600;line-height:1;color:var(--gold2);width:42px;text-align:center;flex:0 0 auto;}
.lang .tx{flex:1;}
.lang .t{font-size:18px;font-weight:600;color:var(--tx);letter-spacing:0.04em;}
.lang .s{font-family:var(--mono);font-size:11px;letter-spacing:0.18em;color:var(--tx3);margin-top:3px;}
.lang .ar{font-size:22px;color:rgba(240,192,116,0.55);}

.foot{position:absolute;bottom:30px;left:0;right:0;text-align:center;font-family:var(--mono);
  font-size:10.5px;letter-spacing:0.14em;color:var(--tx3);line-height:1.8;padding:0 30px;}
</style>
</head>
<body>
<div id="app">
  <div class="atmos"><div class="aurora"></div><div class="stars"></div></div>
  <div class="wrap">
    <div class="orbit"></div>
    <div class="kick">Multiverse Collection · 0613</div>
    <div class="name">夏以晝</div>
    <div class="en">Across Every Universe</div>
    <div class="date">JUNE · 13 · 2026</div>

    <div class="pick">
      <div class="pick-lbl">SELECT LANGUAGE · 選擇語言</div>
      <a class="lang" href="xia-yizhu-birthday.html">
        <div class="ic">中</div>
        <div class="tx"><div class="t">中文</div><div class="s">CHINESE · 繁體中文</div></div>
        <div class="ar">›</div>
      </a>
      <a class="lang" href="xia-yizhu-birthday-en.html">
        <div class="ic">EN</div>
        <div class="tx"><div class="t">English</div><div class="s">ENGLISH VERSION</div></div>
        <div class="ar">›</div>
      </a>
    </div>
  </div>
  <div class="foot">© 2026 夏以晝生日企劃 · Fan Project<br>角色版權歸屬《戀與深空》 · Character © Love and Deepspace</div>
</div>
<script>
function fit(){
  const app=document.getElementById('app');
  if(window.innerWidth<=430){app.style.transform='';return;}
  const k=Math.min((window.innerHeight-28)/844,(window.innerWidth-28)/390,1.25);
  app.style.transform='scale('+Math.max(k,0.4)+')';
}
window.addEventListener('resize',fit);fit();
</script>
</body>
</html>
